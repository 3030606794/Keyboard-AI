name: Keyboard AI Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Install Android platform and build tools
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --console=plain
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Keyboard-AI-APK
        path: app/build/outputs/apk/**/*.apk
